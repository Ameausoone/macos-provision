---
# Requires `mise install` to have provisioned Python already (see README);
# skipped entirely otherwise so a fresh machine's first run doesn't hard-fail
# on it -- just re-run the playbook after `mise install`.
#
# Shells out to the resolved pip binary directly (instead of
# ansible.builtin.pip) since that module needs the `packaging` library on
# whichever Python Ansible itself resolves to run modules, which doesn't
# necessarily match the mise-managed one.
- name: Locate mise-managed pip
  ansible.builtin.command: "{{ lookup('pipe', 'brew --prefix mise') }}/bin/mise which pip"
  register: mac_dev_playbook_mise_pip
  changed_when: false
  # rc 1 = mise's "no pip provisioned yet" exit code, tolerated (see comment
  # above); anything else (e.g. mise itself missing) should fail loudly.
  failed_when: mac_dev_playbook_mise_pip.rc not in [0, 1]

- name: Install pip packages
  ansible.builtin.command: "{{ mac_dev_playbook_mise_pip.stdout }} install {{ item }}"
  register: mac_dev_playbook_pip_install
  changed_when: "'Successfully installed' in mac_dev_playbook_pip_install.stdout"
  loop: "{{ mac_dev_playbook_pip_packages }}"
  when: mac_dev_playbook_mise_pip.rc == 0
